<header class="site-header">
  <div class="wrap header-inner">
    <a class="brand" href="{{ '/' | relative_url }}">
      <svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M8 4h16v12a8 8 0 0 1-16 0z"/><path d="M8 20c3 2 13 2 16 0"/><path d="M12 4v-1M20 4v-1"/><circle cx="16" cy="23" r="1.5" fill="currentColor" stroke="none"/></svg>
      <span>OpenReef</span>
    </a>
    <button class="nav-toggle" aria-label="Menu" aria-expanded="false" data-nav-toggle>
      <span></span><span></span>
    </button>
    <nav class="site-nav" data-nav>
      {% for item in site.data.navigation.main %}
        {% assign active = "" %}
        {% if item.url != "/" and page.url contains item.url %}{% assign active = "is-active" %}{% endif %}
        <a class="{{ active }}" href="{% if item.external %}{{ item.url }}{% else %}{{ item.url | relative_url }}{% endif %}"{% if item.external %} target="_blank" rel="noopener"{% endif %}>{{ item.title }}{% if item.external %} <span class="ext">↗</span>{% endif %}</a>
      {% endfor %}
      <a class="btn btn-small" href="{{ '/docs/getting-started/build-order/' | relative_url }}">Build one</a>
    </nav>
  </div>
</header>
