<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 1400 760' width='1400' height='760'>
<rect width='1400' height='760' fill='#f6f4ee'/>
<text x='30' y='36' font-family='Inter,system-ui,sans-serif' font-size='22' font-weight='600' fill='#15201f'>OpenReef analyzer — wiring diagram</text>
<text x='30' y='56' font-family='Inter,system-ui,sans-serif' font-size='12' fill='#8a9391'>Raspberry Pi 4 (BCM numbering) · 12 V 5 A brick · common ground · I²C bus 1 (3.3 V) · all 12 V loads low-side switched</text>
<rect x='30' y='90' width='190' height='110' rx='8' fill='#fffdf8' stroke='#15201f' stroke-width='1.5'/>
<text x='40' y='110' font-family='Inter,system-ui,sans-serif' font-size='13' font-weight='600' fill='#e4572e'>12 V 5 A PSU</text>
<text x='40' y='128' font-family='Inter,system-ui,sans-serif' font-size='11' fill='#15201f'>+12 V → rail (red)</text>
<text x='40' y='143' font-family='Inter,system-ui,sans-serif' font-size='11' fill='#15201f'>GND → rail (black)</text>
<text x='40' y='158' font-family='Inter,system-ui,sans-serif' font-size='11' fill='#15201f'>Barrel jack + 5 A fuse</text>
<rect x='30' y='230' width='190' height='95' rx='8' fill='#fffdf8' stroke='#15201f' stroke-width='1.5'/>
<text x='40' y='250' font-family='Inter,system-ui,sans-serif' font-size='13' font-weight='600' fill='#15201f'>5 V 3 A buck</text>
<text x='40' y='268' font-family='Inter,system-ui,sans-serif' font-size='11' fill='#15201f'>IN: 12 V rail</text>
<text x='40' y='283' font-family='Inter,system-ui,sans-serif' font-size='11' fill='#15201f'>OUT: 5 V → Pi 5V (pin 2)</text>
<text x='40' y='298' font-family='Inter,system-ui,sans-serif' font-size='11' fill='#15201f'>GND common</text>
<rect x='300' y='90' width='300' height='400' rx='8' fill='#fffdf8' stroke='#15201f' stroke-width='1.5'/>
<text x='310' y='110' font-family='Inter,system-ui,sans-serif' font-size='13' font-weight='600' fill='#0f8b8d'>Raspberry Pi 4 (BCM)</text>
<text x='310' y='128' font-family='Inter,system-ui,sans-serif' font-size='11' fill='#15201f'>GPIO2 SDA · GPIO3 SCL  → I²C bus</text>
<text x='310' y='143' font-family='Inter,system-ui,sans-serif' font-size='11' fill='#15201f'>GPIO4  → DS18B20 data (4.7 kΩ to 3V3)</text>
<text x='310' y='158' font-family='Inter,system-ui,sans-serif' font-size='11' fill='#15201f'>GPIO17 → stepper EN (all TMC2209)</text>
<text x='310' y='173' font-family='Inter,system-ui,sans-serif' font-size='11' fill='#15201f'>GPIO27/22  SP1 STEP/DIR (acid)</text>
<text x='310' y='188' font-family='Inter,system-ui,sans-serif' font-size='11' fill='#15201f'>GPIO23/24  SP2 STEP/DIR (NP R1)</text>
<text x='310' y='203' font-family='Inter,system-ui,sans-serif' font-size='11' fill='#15201f'>GPIO25/5   SP3 STEP/DIR (NP R2)</text>
<text x='310' y='218' font-family='Inter,system-ui,sans-serif' font-size='11' fill='#15201f'>GPIO6/12   SP4 STEP/DIR (NP R3a)</text>
<text x='310' y='233' font-family='Inter,system-ui,sans-serif' font-size='11' fill='#15201f'>GPIO13/16  SP5 STEP/DIR (NP R3b)</text>
<text x='310' y='248' font-family='Inter,system-ui,sans-serif' font-size='11' fill='#15201f'>GPIO18 → heater MOSFET PWM (optional)</text>
<text x='310' y='263' font-family='Inter,system-ui,sans-serif' font-size='11' fill='#15201f'>GPIO19 → LED white · GPIO21 → LED 850 nm</text>
<text x='310' y='278' font-family='Inter,system-ui,sans-serif' font-size='11' fill='#15201f'>GPIO20 → alarm relay IN</text>
<text x='310' y='293' font-family='Inter,system-ui,sans-serif' font-size='11' fill='#15201f'>GPIO26 ← leak sensor (pull-up, low = wet)</text>
<text x='310' y='308' font-family='Inter,system-ui,sans-serif' font-size='11' fill='#15201f'>5V pin 2 ← buck · 3V3 pin 1 → sensors</text>
<text x='310' y='323' font-family='Inter,system-ui,sans-serif' font-size='11' fill='#15201f'>GND pins 6/9/14/20/25/30/34/39</text>
<rect x='700' y='90' width='230' height='90' rx='8' fill='#fffdf8' stroke='#15201f' stroke-width='1.5'/>
<text x='710' y='110' font-family='Inter,system-ui,sans-serif' font-size='13' font-weight='600' fill='#15201f'>EZO-pH on isolated carrier</text>
<text x='710' y='128' font-family='Inter,system-ui,sans-serif' font-size='11' fill='#15201f'>I²C 0x63 · 3V3 · GND</text>
<text x='710' y='143' font-family='Inter,system-ui,sans-serif' font-size='11' fill='#15201f'>BNC → lab-grade pH probe (Cell A)</text>
<rect x='700' y='200' width='230' height='90' rx='8' fill='#fffdf8' stroke='#15201f' stroke-width='1.5'/>
<text x='710' y='220' font-family='Inter,system-ui,sans-serif' font-size='13' font-weight='600' fill='#15201f'>AS7341 spectral sensor</text>
<text x='710' y='238' font-family='Inter,system-ui,sans-serif' font-size='11' fill='#15201f'>I²C 0x39 · 3V3 · GND</text>
<text x='710' y='253' font-family='Inter,system-ui,sans-serif' font-size='11' fill='#15201f'>Mounted in Cell B holder</text>
<rect x='700' y='310' width='230' height='180' rx='8' fill='#fffdf8' stroke='#15201f' stroke-width='1.5'/>
<text x='710' y='330' font-family='Inter,system-ui,sans-serif' font-size='13' font-weight='600' fill='#15201f'>MCP23017 I/O expander</text>
<text x='710' y='348' font-family='Inter,system-ui,sans-serif' font-size='11' fill='#15201f'>I²C 0x20 · 3V3 · GND</text>
<text x='710' y='363' font-family='Inter,system-ui,sans-serif' font-size='11' fill='#15201f'>Port A (inputs, pull-ups):</text>
<text x='710' y='378' font-family='Inter,system-ui,sans-serif' font-size='11' fill='#15201f'> A0–A4 limit switches SP1–SP5</text>
<text x='710' y='393' font-family='Inter,system-ui,sans-serif' font-size='11' fill='#15201f'> A5 waste float switch</text>
<text x='710' y='408' font-family='Inter,system-ui,sans-serif' font-size='11' fill='#15201f'> A6/A7 spare</text>
<text x='710' y='423' font-family='Inter,system-ui,sans-serif' font-size='11' fill='#15201f'>Port B (outputs) → MOSFET board IN1–8</text>
<rect x='1030' y='310' width='330' height='200' rx='8' fill='#fffdf8' stroke='#15201f' stroke-width='1.5'/>
<text x='1040' y='330' font-family='Inter,system-ui,sans-serif' font-size='13' font-weight='600' fill='#15201f'>8-ch low-side MOSFET board (12 V)</text>
<text x='1040' y='348' font-family='Inter,system-ui,sans-serif' font-size='11' fill='#15201f'>IN1 FILL_A   → P1 peristaltic</text>
<text x='1040' y='363' font-family='Inter,system-ui,sans-serif' font-size='11' fill='#15201f'>IN2 LEVEL_A  → P2 peristaltic</text>
<text x='1040' y='378' font-family='Inter,system-ui,sans-serif' font-size='11' fill='#15201f'>IN3 DRAIN_A  → P3 peristaltic</text>
<text x='1040' y='393' font-family='Inter,system-ui,sans-serif' font-size='11' fill='#15201f'>IN4 FILL_B   → P4 peristaltic</text>
<text x='1040' y='408' font-family='Inter,system-ui,sans-serif' font-size='11' fill='#15201f'>IN5 LEVEL_B  → P5 peristaltic</text>
<text x='1040' y='423' font-family='Inter,system-ui,sans-serif' font-size='11' fill='#15201f'>IN6 DRAIN_B  → P6 peristaltic</text>
<text x='1040' y='438' font-family='Inter,system-ui,sans-serif' font-size='11' fill='#15201f'>IN7 STIR_A   → 40 mm fan + magnets</text>
<text x='1040' y='453' font-family='Inter,system-ui,sans-serif' font-size='11' fill='#15201f'>IN8 STIR_B   → 40 mm fan + magnets</text>
<text x='1040' y='468' font-family='Inter,system-ui,sans-serif' font-size='11' fill='#15201f'>V+ 12 V rail · GND common · flyback diodes</text>
<rect x='300' y='540' width='640' height='150' rx='8' fill='#fffdf8' stroke='#15201f' stroke-width='1.5'/>
<text x='310' y='560' font-family='Inter,system-ui,sans-serif' font-size='13' font-weight='600' fill='#15201f'>Stepper carrier board — 5× TMC2209 StepStick</text>
<text x='310' y='578' font-family='Inter,system-ui,sans-serif' font-size='11' fill='#15201f'>VMOT 12 V (100 µF per driver) · VIO 3V3 · GND · EN common (GPIO17) · MS1/MS2 high = 1/16 µstep</text>
<text x='310' y='593' font-family='Inter,system-ui,sans-serif' font-size='11' fill='#15201f'>STEP/DIR from Pi GPIO as listed · VREF 0.6 V (≈0.85 A RMS) for NEMA17 17HS4023</text>
<text x='310' y='608' font-family='Inter,system-ui,sans-serif' font-size='11' fill='#15201f'>SP1 → acid syringe pump (Cell A)      SP2–SP5 → Trident NP reagent syringe pumps (Cell B)</text>
<text x='310' y='623' font-family='Inter,system-ui,sans-serif' font-size='11' fill='#15201f'>Each pump: NEMA17 4-wire · micro switch at home (to MCP23017 A0–A4, COM→GND, NO→pin)</text>
<rect x='1030' y='90' width='330' height='90' rx='8' fill='#fffdf8' stroke='#15201f' stroke-width='1.5'/>
<text x='1040' y='110' font-family='Inter,system-ui,sans-serif' font-size='13' font-weight='600' fill='#c98a1a'>Alarm relay (5 V module)</text>
<text x='1040' y='128' font-family='Inter,system-ui,sans-serif' font-size='11' fill='#15201f'>IN ← GPIO20 · VCC 5 V · GND</text>
<text x='1040' y='143' font-family='Inter,system-ui,sans-serif' font-size='11' fill='#15201f'>COM/NO dry contact → Hydros Sense port (float-switch input)</text>
<rect x='1030' y='200' width='330' height='90' rx='8' fill='#fffdf8' stroke='#15201f' stroke-width='1.5'/>
<text x='1040' y='220' font-family='Inter,system-ui,sans-serif' font-size='13' font-weight='600' fill='#15201f'>Leak + waste sensors</text>
<text x='1040' y='238' font-family='Inter,system-ui,sans-serif' font-size='11' fill='#15201f'>Leak: resistive pad in drip tray → GPIO26 (pull-up)</text>
<text x='1040' y='253' font-family='Inter,system-ui,sans-serif' font-size='11' fill='#15201f'>Waste: float switch in 2 L bottle → MCP23017 A5</text>
<rect x='30' y='360' width='190' height='110' rx='8' fill='#fffdf8' stroke='#15201f' stroke-width='1.5'/>
<text x='40' y='380' font-family='Inter,system-ui,sans-serif' font-size='13' font-weight='600' fill='#15201f'>LEDs (Cell B)</text>
<text x='40' y='398' font-family='Inter,system-ui,sans-serif' font-size='11' fill='#15201f'>White: 5V→68 Ω→LED→2N7002</text>
<text x='40' y='413' font-family='Inter,system-ui,sans-serif' font-size='11' fill='#15201f'>  gate GPIO19</text>
<text x='40' y='428' font-family='Inter,system-ui,sans-serif' font-size='11' fill='#15201f'>850 nm IR: 5V→47 Ω→LED→2N7002</text>
<text x='40' y='443' font-family='Inter,system-ui,sans-serif' font-size='11' fill='#15201f'>  gate GPIO21</text>
<rect x='30' y='500' width='190' height='95' rx='8' fill='#fffdf8' stroke='#15201f' stroke-width='1.5'/>
<text x='40' y='520' font-family='Inter,system-ui,sans-serif' font-size='13' font-weight='600' fill='#15201f'>DS18B20 (Cell A)</text>
<text x='40' y='538' font-family='Inter,system-ui,sans-serif' font-size='11' fill='#15201f'>Red 3V3 · Black GND</text>
<text x='40' y='553' font-family='Inter,system-ui,sans-serif' font-size='11' fill='#15201f'>Yellow → GPIO4, 4.7 kΩ to 3V3</text>
<text x='40' y='568' font-family='Inter,system-ui,sans-serif' font-size='11' fill='#15201f'>dtoverlay=w1-gpio,gpiopin=4</text>
<rect x='30' y='625' width='190' height='95' rx='8' fill='#fffdf8' stroke='#8a9391' stroke-width='1.5'/>
<text x='40' y='645' font-family='Inter,system-ui,sans-serif' font-size='13' font-weight='600' fill='#8a9391'>Fluidics note</text>
<text x='40' y='663' font-family='Inter,system-ui,sans-serif' font-size='11' fill='#15201f'>6 peristaltic + 2 stir fans</text>
<text x='40' y='678' font-family='Inter,system-ui,sans-serif' font-size='11' fill='#15201f'>on MOSFET board (right)</text>
<text x='40' y='693' font-family='Inter,system-ui,sans-serif' font-size='11' fill='#15201f'>5 syringe pumps on carrier</text>
<rect x='1030' y='560' width='330' height='150' rx='8' fill='#fffdf8' stroke='#8a9391' stroke-width='1.5'/>
<text x='1040' y='580' font-family='Inter,system-ui,sans-serif' font-size='13' font-weight='600' fill='#8a9391'>Optional heater (Cell B, 35 °C)</text>
<text x='1040' y='598' font-family='Inter,system-ui,sans-serif' font-size='11' fill='#15201f'>12 V 10 W silicone pad around holder</text>
<text x='1040' y='613' font-family='Inter,system-ui,sans-serif' font-size='11' fill='#15201f'>IRLZ44N low-side, gate ← GPIO18 PWM</text>
<text x='1040' y='628' font-family='Inter,system-ui,sans-serif' font-size='11' fill='#15201f'>10 kΩ NTC → ADS1115 (0x48) or use DS18B20 #2</text>
<text x='1040' y='643' font-family='Inter,system-ui,sans-serif' font-size='11' fill='#15201f'>Needed only for slow nitrate chemistries</text>
<path d='M220,110 L260,110 L260,560 L300,560' fill='none' stroke='#d33' stroke-width='2'/><text x='264' y='556' font-family='Inter,system-ui,sans-serif' font-size='10' fill='#d33'>12 V</text>
<path d='M260,520 L1100,520 L1100,510' fill='none' stroke='#d33' stroke-width='2' stroke-dasharray='4 4'/>
<text x='700' y='533' font-family='Inter,system-ui,sans-serif' font-size='10' fill='#d33'>12 V rail → MOSFET board V+</text>
<path d='M220,280 L280,280 L280,460 L300,460' fill='none' stroke='#d33' stroke-width='1.5'/><text x='284' y='456' font-family='Inter,system-ui,sans-serif' font-size='10' fill='#d33'>5 V</text>
<path d='M600,130 L700,130' fill='none' stroke='#2d6cdf' stroke-width='2'/><text x='704' y='126' font-family='Inter,system-ui,sans-serif' font-size='10' fill='#2d6cdf'>I²C</text>
<path d='M650,130 L650,240 L700,240' fill='none' stroke='#2d6cdf' stroke-width='2'/>
<path d='M650,240 L650,350 L700,350' fill='none' stroke='#2d6cdf' stroke-width='2'/>
<path d='M930,450 L1030,450' fill='none' stroke='#2a9d3f' stroke-width='2'/>
<text x='950' y='443' font-family='Inter,system-ui,sans-serif' font-size='10' fill='#2a9d3f'>8× logic</text>
<path d='M450,490 L450,540' fill='none' stroke='#d8b400' stroke-width='2'/><text x='454' y='536' font-family='Inter,system-ui,sans-serif' font-size='10' fill='#d8b400'>STEP/DIR/EN ×11</text>
<path d='M560,90 L560,70 L1200,70 L1200,90' fill='none' stroke='#c98a1a' stroke-width='2'/><text x='1204' y='66' font-family='Inter,system-ui,sans-serif' font-size='10' fill='#c98a1a'>GPIO20</text>
<path d='M300,540 L280,540 L280,480 L300,480' fill='none' stroke='#222' stroke-width='0.01'/>
<path d='M300,410 L220,410' fill='none' stroke='#222' stroke-width='2'/><text x='224' y='406' font-family='Inter,system-ui,sans-serif' font-size='10' fill='#222'>GPIO19/21</text>
<path d='M300,475 L270,475 L270,540 L220,540' fill='none' stroke='#222' stroke-width='2'/><text x='274' y='536' font-family='Inter,system-ui,sans-serif' font-size='10' fill='#222'>GPIO4</text>
<path d='M940,660 L1030,660' fill='none' stroke='#8a9391' stroke-width='2' stroke-dasharray='3 3'/>
<text x='945' y='675' font-family='Inter,system-ui,sans-serif' font-size='10' fill='#8a9391'>GPIO18 via carrier</text>
<text x='30' y='730' font-family='Inter,system-ui,sans-serif' font-size='11' fill='#8a9391'>Ground: star point at the PSU terminal. Keep the EZO carrier's isolated ground separate from the 12 V motor return; route pH BNC away from stepper cables. Leak sensor pad sits lowest in the wet bay.</text>
</svg>