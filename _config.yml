# OpenReef — openreef.dev
# Custom theme (no remote_theme). Builds on GitHub Pages or locally with `bundle exec jekyll serve`.

title: OpenReef
tagline: Open-source automated reef water analyzer
description: >-
  OpenReef is an open-hardware analyzer that measures alkalinity, nitrate and phosphate in reef
  aquariums on a schedule — Gran titration and self-blanked colorimetry on a Raspberry Pi, with a full
  REST API, for about $850 in parts.
url: "https://openreef.dev"
baseurl: ""
repository: thetemplateblog/openreef
github_url: https://github.com/thetemplateblog/openreef
version: "2.0"
lang: en

markdown: kramdown
highlighter: rouge
kramdown:
  input: GFM
  auto_ids: true
  toc_levels: 2..3
  syntax_highlighter_opts:
    css_class: highlight

permalink: pretty
timezone: America/New_York

plugins:
  - jekyll-sitemap
  - jekyll-seo-tag

collections:
  docs:
    output: true
    permalink: /docs/:path/

defaults:
  - scope:
      path: ""
      type: docs
    values:
      layout: doc
  - scope:
      path: ""
    values:
      layout: page

exclude:
  - .gitignore
  - Gemfile
  - Gemfile.lock
  - vendor/
  - node_modules/
  - firmware/
  - hardware/
  - legacy/
  - README.md
  - LICENSE
  - "*.py"

sass:
  style: compressed
