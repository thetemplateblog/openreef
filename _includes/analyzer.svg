<svg class="analyzer-art" viewBox="0 0 520 480" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Front view of the OpenReef analyzer: wet bay with two cells and five syringe pumps, dry bay with the Raspberry Pi">
  <defs>
    <linearGradient id="glass" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#ffffff" stop-opacity=".9"/><stop offset="1" stop-color="#dff1f0" stop-opacity=".9"/></linearGradient>
    <linearGradient id="liquid" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#9fd8d6"/><stop offset="1" stop-color="#0f8b8d"/></linearGradient>
    <g id="pump" stroke="#15201f" stroke-width="1.5" fill="none" stroke-linejoin="round" stroke-linecap="round">
      <rect x="0" y="0" width="44" height="26" rx="3" fill="#15201f"/>
      <rect x="6" y="26" width="32" height="84" rx="4" fill="#fffdf8"/>
      <rect x="16" y="34" width="12" height="60" rx="3" fill="url(#glass)"/>
      <rect x="17" y="60" width="10" height="33" fill="url(#liquid)" stroke="none"/>
      <line x1="22" y1="26" x2="22" y2="60"/>
      <path d="M22 110 v12"/>
    </g>
  </defs>
  <g stroke="#15201f" stroke-width="1.5" fill="none" stroke-linejoin="round" stroke-linecap="round">
    <!-- enclosure -->
    <rect x="30" y="20" width="460" height="440" rx="10" fill="#fffdf8"/>
    <line x1="330" y1="20" x2="330" y2="460"/>
    <text x="48" y="44" font-family="Inter, sans-serif" font-size="10" fill="#8a9391" stroke="none" letter-spacing="2">WET BAY</text>
    <text x="348" y="44" font-family="Inter, sans-serif" font-size="10" fill="#8a9391" stroke="none" letter-spacing="2">DRY BAY</text>

    <!-- cells shelf -->
    <line x1="30" y1="150" x2="330" y2="150" stroke-dasharray="3 4" stroke="#8a9391"/>
    <!-- Cell A: vial with electrode -->
    <rect x="70" y="62" width="60" height="88" rx="8" fill="url(#glass)"/>
    <path d="M72 108 h56 v34 a8 8 0 0 1 -8 8 h-40 a8 8 0 0 1 -8 -8 z" fill="url(#liquid)" stroke="none" opacity=".85"/>
    <rect x="66" y="52" width="68" height="12" rx="3" fill="#e3dfd4"/>
    <rect x="92" y="22" width="10" height="100" rx="3" fill="#fff"/>
    <line x1="76" y1="52" x2="76" y2="30"/><line x1="112" y1="52" x2="112" y2="30"/><line x1="124" y1="52" x2="124" y2="30"/>
    <rect x="86" y="132" width="28" height="6" rx="3" fill="#15201f"/>
    <text x="100" y="166" text-anchor="middle" font-family="Inter, sans-serif" font-size="9" fill="#4a5553" stroke="none">CELL A · pH titration</text>

    <!-- Cell B: cuvette in holder with LED/sensor -->
    <rect x="200" y="78" width="70" height="72" rx="6" fill="#15201f"/>
    <rect x="224" y="40" width="22" height="100" rx="3" fill="url(#glass)"/>
    <path d="M226 98 h18 v38 a3 3 0 0 1 -3 3 h-12 a3 3 0 0 1 -3 -3 z" fill="#e4572e" stroke="none" opacity=".75"/>
    <circle cx="208" cy="110" r="3" fill="#fff"/><circle cx="208" cy="122" r="3" fill="#c98a1a"/>
    <rect x="258" y="104" width="8" height="24" rx="1" fill="#2d6cdf"/>
    <line x1="212" y1="116" x2="256" y2="116" stroke="#c98a1a" stroke-dasharray="2 3"/>
    <line x1="230" y1="40" x2="230" y2="26"/><line x1="240" y1="40" x2="240" y2="26"/>
    <text x="235" y="166" text-anchor="middle" font-family="Inter, sans-serif" font-size="9" fill="#4a5553" stroke="none">CELL B · colorimetry</text>

    <!-- syringe pump bank -->
    <line x1="30" y1="300" x2="330" y2="300" stroke-dasharray="3 4" stroke="#8a9391"/>
    <use href="#pump" x="46" y="184"/>
    <use href="#pump" x="100" y="184"/>
    <use href="#pump" x="154" y="184"/>
    <use href="#pump" x="208" y="184"/>
    <use href="#pump" x="262" y="184"/>
    <text x="180" y="316" text-anchor="middle" font-family="Inter, sans-serif" font-size="9" fill="#4a5553" stroke="none">5 × SYRINGE PUMPS · acid + NP reagents</text>

    <!-- bottle tray -->
    <g fill="#fffdf8">
      <rect x="52" y="340" width="40" height="100" rx="6"/><rect x="60" y="330" width="24" height="12" rx="2"/>
      <rect x="104" y="340" width="40" height="100" rx="6"/><rect x="112" y="330" width="24" height="12" rx="2"/>
      <rect x="156" y="340" width="40" height="100" rx="6"/><rect x="164" y="330" width="24" height="12" rx="2"/>
      <rect x="208" y="340" width="40" height="100" rx="6"/><rect x="216" y="330" width="24" height="12" rx="2"/>
      <rect x="262" y="340" width="52" height="100" rx="6"/><rect x="276" y="330" width="24" height="12" rx="2"/>
    </g>
    <text x="180" y="456" text-anchor="middle" font-family="Inter, sans-serif" font-size="9" fill="#4a5553" stroke="none">REAGENTS · 0.02 N HCl</text>

    <!-- dry bay: Pi, drivers, PSU -->
    <rect x="350" y="70" width="120" height="78" rx="6" fill="#dff1f0"/>
    <rect x="360" y="80" width="30" height="20" rx="2" fill="#15201f"/><rect x="398" y="80" width="18" height="18" rx="2" fill="#15201f"/>
    <rect x="424" y="80" width="36" height="12" rx="2" fill="#fffdf8"/><rect x="424" y="96" width="36" height="12" rx="2" fill="#fffdf8"/>
    <g fill="#15201f"><rect x="360" y="110" width="100" height="6" rx="1"/><rect x="360" y="124" width="100" height="6" rx="1"/></g>
    <text x="410" y="166" text-anchor="middle" font-family="Inter, sans-serif" font-size="9" fill="#4a5553" stroke="none">RASPBERRY PI 4</text>
    <rect x="350" y="190" width="120" height="100" rx="6" fill="#fffdf8"/>
    <g fill="#e3dfd4"><rect x="358" y="200" width="20" height="36" rx="2"/><rect x="382" y="200" width="20" height="36" rx="2"/><rect x="406" y="200" width="20" height="36" rx="2"/><rect x="430" y="200" width="20" height="36" rx="2"/><rect x="358" y="244" width="20" height="36" rx="2"/></g>
    <rect x="386" y="246" width="70" height="34" rx="3" fill="#dff1f0"/>
    <text x="410" y="316" text-anchor="middle" font-family="Inter, sans-serif" font-size="9" fill="#4a5553" stroke="none">TMC2209 ×5 · MCP23017</text>
    <rect x="350" y="340" width="120" height="60" rx="6" fill="#15201f"/>
    <text x="410" y="374" text-anchor="middle" font-family="Inter, sans-serif" font-size="10" fill="#fffdf8" stroke="none">12 V · 5 A</text>
    <rect x="350" y="412" width="120" height="28" rx="6" fill="#fffdf8"/>
    <circle cx="364" cy="426" r="4" fill="#1f9d55" stroke="none"/>
    <text x="376" y="430" font-family="Inter, sans-serif" font-size="9" fill="#4a5553" stroke="none">MOSFET ×8 · relay</text>
  </g>
</svg>
