# OpenReef Website Configuration
# GitHub Pages + Jekyll with Minimal Mistakes theme

# Site settings
title: OpenReef
title_separator: "|"
subtitle: "Automated Water Quality Testing"
name: "OpenReef Project"
description: Open-source automated water quality testing for phosphate and nitrate analysis
baseurl: "" # No baseurl for custom domain
url: "https://openreef.dev" # Custom domain
repository: "thetemplateblog/openreef"
teaser: # path of fallback teaser image
logo: # path of logo image to display in the masthead
masthead_title: # overrides the website title displayed in the masthead, use " " for no title

# Theme - Minimal Mistakes
remote_theme: mmistakes/minimal-mistakes@4.24.0
minimal_mistakes_skin: "dark" # "air", "aqua", "contrast", "dark", "dirt", "neon", "mint", "plum", "sunrise"

# Site Author
author:
  name: "OpenReef Project"
  avatar: "/assets/images/bio-photo.jpg"
  bio: "Open-source automated water quality testing"
  links:
    - label: "GitHub"
      icon: "fab fa-fw fa-github"
      url: "https://github.com/thetemplateblog/openreef"

# Site Footer
footer:
  links:
    - label: "GitHub"
      icon: "fab fa-fw fa-github"
      url: "https://github.com/thetemplateblog/openreef"

# Reading Files
include:
  - .htaccess
  - _pages

exclude:
  - .gitignore
  - .git/
  - hardware/
  - firmware/
  - node_modules/
  - vendor/
  - Gemfile
  - Gemfile.lock

# Conversion
markdown: kramdown
highlighter: rouge
lsi: false
excerpt_separator: "\n\n"
incremental: false

# Markdown Processing
kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
  footnote_nr: 1
  entity_output: as_char
  toc_levels: 1..6
  smart_quotes: lsquo,rsquo,ldquo,rdquo
  enable_coderay: false

# Defaults
defaults:
  # _posts
  - scope:
      path: ""
      type: posts
    values:
      layout: single
      author_profile: true
      read_time: true
      comments: false
      share: true
      related: true
  # _pages
  - scope:
      path: "_pages"
      type: pages
    values:
      layout: single
      author_profile: true
  # _docs
  - scope:
      path: ""
      type: docs
    values:
      layout: single
      read_time: false
      author_profile: false
      share: false
      comments: false
      sidebar:
        nav: "docs"

# Collections
collections:
  docs:
    output: true
    permalink: /:collection/:path/

# Sass/SCSS
sass:
  sass_dir: _sass
  style: compressed

# Outputting
permalink: /:categories/:title/
timezone: America/Los_Angeles

# Plugins
plugins:
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-gist
  - jekyll-feed
  - jekyll-include-cache

# Archives
category_archive:
  type: liquid
  path: /categories/
tag_archive:
  type: liquid
  path: /tags/

# HTML Compression
compress_html:
  clippings: all
  ignore:
    envs: development
